name: JavaScript syntax

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HACS loader
        run: node --check boiler-control-card-loader.js
      - name: Check Boiler Control Card
        run: node --check boiler-control-card.js
      - name: Check Shnek Control Card
        run: node --check shnek-control-card.js
      - name: Check Shnek daily extension
        run: node --check shnek-control-card-daily.js
